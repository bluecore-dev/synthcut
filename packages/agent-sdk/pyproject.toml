[project]
name = "synthcut-agent-sdk"
version = "0.1.0"
description = "Agent and typed tool interfaces with per-agent permissions"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.10",
  "synthcut-model-router",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "synthcut_agent_sdk"
module-root = ""
