[project]
name = "synthcut-telemetry"
version = "0.1.0"
description = "Structured logging, real-time event streams, cost telemetry"
requires-python = ">=3.12,<3.13"
dependencies = [
  "synthcut-core",
  "synthcut-schemas",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "synthcut_telemetry"
module-root = ""
