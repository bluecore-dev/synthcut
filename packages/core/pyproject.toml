[project]
name = "synthcut-core"
version = "0.1.0"
description = "Settings, database models, job queue, events"
requires-python = ">=3.12,<3.13"
dependencies = [
  "synthcut-schemas",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
  "sqlalchemy[asyncio]>=2.0.36",
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "redis>=5.2",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "synthcut_core"
module-root = ""
