[project]
name = "synthcut-schemas"
version = "0.1.0"
description = "Shared typed contracts: API DTOs, enums, events, job payloads"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pydantic>=2.10",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "synthcut_schemas"
module-root = ""
