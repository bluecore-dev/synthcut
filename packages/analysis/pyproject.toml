[project]
name = "synthcut-analysis"
version = "0.1.0"
description = "Deterministic shot analysis (spec §12): sharpness, exposure, camera motion, faces, speech, usability"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0",
  # Face detection (YuNet, CPU). Headless: no GUI libraries in the image.
  "opencv-python-headless>=4.10",
  "synthcut-media",
  "synthcut-schemas",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "synthcut_analysis"
module-root = ""
