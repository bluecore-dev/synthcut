[project]
name = "synthcut-speech"
version = "0.1.0"
description = "Speech engine (spec §13): transcription with word timings, silences, subtitle cues"
requires-python = ">=3.12,<3.13"
dependencies = [
  # Local CPU Whisper (CTranslate2, int8). Audio is decoded by our own ffmpeg,
  # never by faster-whisper's PyAV path (incompatible with PyAV 19).
  "faster-whisper>=1.2,<2",
  "numpy>=2.0",
  "synthcut-media",
  "synthcut-schemas",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "synthcut_speech"
module-root = ""
