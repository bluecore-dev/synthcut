[project]
name = "synthcut-storage"
version = "0.1.0"
description = "S3-compatible object storage: key layout, multipart, presigning"
requires-python = ">=3.12,<3.13"
dependencies = [
  "boto3>=1.36",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "synthcut_storage"
module-root = ""
