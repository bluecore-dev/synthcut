[project]
name = "synthcut-worker"
version = "0.1.0"
description = "SynthCut background workers (Postgres-leased job queue)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "synthcut-core",
  "synthcut-schemas",
  "synthcut-storage",
  "synthcut-media",
  "synthcut-speech",
  "synthcut-analysis",
  "synthcut-telemetry",
  "httpx>=0.28",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "synthcut_worker"
module-root = ""
