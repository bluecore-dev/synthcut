[project]
name = "synthcut-bot"
version = "0.1.0"
description = "SynthCut Telegram bot (webhook)"
requires-python = ">=3.12,<3.13"
dependencies = [
  "synthcut-core",
  "synthcut-schemas",
  "synthcut-telemetry",
  "aiogram>=3.17",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "synthcut_bot"
module-root = ""
