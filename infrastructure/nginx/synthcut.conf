# SynthCut — host nginx (TLS + routing). Installed by
# infrastructure/deployment/activate.sh as /etc/nginx/sites-available/synthcut;
# __DOMAIN__ is replaced at install time. Do not edit on the server.
#
# Upstream names are prefixed so they cannot clash with other sites on this VPS.

upstream synthcut_api { server 127.0.0.1:3400; keepalive 16; }
upstream synthcut_web { server 127.0.0.1:3401; keepalive 8; }
upstream synthcut_storage { server 127.0.0.1:3402; keepalive 16; }
upstream synthcut_bot { server 127.0.0.1:3403; keepalive 4; }

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/synthcut-acme;
        default_type text/plain;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name __DOMAIN__;

    ssl_certificate /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # The API only ever receives JSON: video bytes never pass through it (spec rule 2).
    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Presigned direct-to-storage uploads, same origin as the Mini App (no CORS).
    # Path and Host must reach Garage unchanged or the SigV4 signature breaks.
    location ^~ /synthcut-media/ {
        limit_except GET PUT { deny all; }
        client_max_body_size 80m;
        client_body_timeout 600s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_pass http://synthcut_storage;
    }

    location ^~ /telegram/ {
        client_max_body_size 2m;
        proxy_pass http://synthcut_bot;
    }

    # Server-Sent Events: no buffering, long-lived.
    location ~ ^/api/v1/projects/[0-9a-f-]+/events/stream$ {
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_pass http://synthcut_api;
    }

    location /api/ {
        proxy_read_timeout 120s;
        proxy_pass http://synthcut_api;
    }

    location / {
        proxy_pass http://synthcut_web;
    }
}
