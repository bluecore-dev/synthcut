# Used only until the first certificate exists: serves the ACME challenge.
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/synthcut-acme;
        default_type text/plain;
    }
    location / {
        return 503;
    }
}
